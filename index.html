<html lang="en">
<head>

<title>Swing Delay</title>

<style>
:root{
  --bg:#000; --panel:#101014; --line:#26262e; --txt:#f5f5f7; --dim:#a1a1aa;
  --red:#e5484d; --green:#30a46c; --blue:#3e9bff; --amber:#f5a524;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;padding:0;}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  display:flex; flex-direction:column; max-width:640px; margin:0 auto;
  height:100%; height:100dvh; overflow:hidden; overscroll-behavior:none;
  user-select:none; -webkit-user-select:none;
}
button{font-family:inherit;}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  border-bottom:1px solid var(--line); background:var(--panel);
}
.topbar h1{font-size:17px; letter-spacing:2px; margin:0; font-weight:800;}
.topbar h1 span{color:var(--red);}
#profileChip{
  background:#1c1c22; color:var(--txt); border:1px solid var(--line);
  border-radius:999px; padding:8px 14px; font-size:14px; font-weight:600; max-width:55%;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#profileChip .bats{color:var(--amber); font-weight:800; margin-left:6px;}
main{flex:1; display:flex; flex-direction:column; min-height:0; position:relative;}
#stage{flex:1; position:relative; background:#000; min-height:0;}
#view{position:absolute; inset:0; width:100%; height:100%; display:block;}
.overlay{
  position:absolute; inset:0; display:flex; flex-direction:column; gap:14px;
  align-items:center; justify-content:center; background:rgba(0,0,0,.72);
  text-align:center; padding:24px; z-index:5;
}
.overlay[hidden]{display:none;}
.overlay p{color:var(--dim); font-size:14px; line-height:1.5; margin:0; max-width:300px;}
#startBtn{
  background:var(--red); color:#fff; border:0; border-radius:16px;
  font-size:20px; font-weight:800; padding:18px 42px;
}
#startBtn:disabled{opacity:.55;}
#warmup{font-size:15px; color:var(--dim); letter-spacing:1px;}
#warmup .dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--amber); margin-right:8px; animation:blink 1s infinite;}
.warmup-inner{font-size:15px; letter-spacing:1px;}
@keyframes blink{50%{opacity:.2;}}
#recDot{
  position:absolute; top:calc(env(safe-area-inset-top,0px) + 12px); left:14px; z-index:4;
  display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--txt);
  background:rgba(0,0,0,.55); padding:6px 10px; border-radius:999px;
}
#recDot[hidden]{display:none;}
#recDot i{width:9px; height:9px; border-radius:50%; background:var(--red); animation:blink 1.2s infinite;}
.controls{background:var(--panel); border-top:1px solid var(--line); padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 12px);}
.crow{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.crow:last-child{margin-bottom:0;}
.clabel{font-size:13px; color:var(--dim); font-weight:600; min-width:52px;}
#delayRange{flex:1; accent-color:var(--red); height:32px;}
#delayVal{font-size:15px; font-weight:800; min-width:44px; text-align:right;}
.seg{display:flex; background:#1c1c22; border:1px solid var(--line); border-radius:12px; overflow:hidden;}
.seg button{
  flex:1; background:transparent; border:0; color:var(--dim);
  font-size:14px; font-weight:700; padding:11px 0;
}
.seg button.on{background:var(--red); color:#fff;}
.tbtn{
  background:#1c1c22; color:var(--txt); border:1px solid var(--line);
  border-radius:12px; font-size:14px; font-weight:700; padding:11px 12px;
}
.tbtn.on{border-color:var(--green); color:var(--green);}
#saveLenBtn{min-width:64px;}
#saveBtn{
  flex:1; background:var(--red); color:#fff; border:0; border-radius:14px;
  font-size:19px; font-weight:800; padding:16px 0; letter-spacing:.5px;
}
#saveBtn:active{transform:scale(.98);}
.navrow{display:flex; gap:10px;}
.navrow .tbtn{flex:1;}
section.page{flex:1; display:flex; flex-direction:column; min-height:0; background:var(--bg);}
section.page[hidden]{display:none;}
.pagehead{display:flex; align-items:center; justify-content:space-between; padding:14px; border-bottom:1px solid var(--line);}
.pagehead h2{margin:0; font-size:18px;}
.scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 14px 24px;}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:13px 14px; margin-bottom:10px; display:flex; align-items:center; gap:10px;
}
.card .nm{flex:1; min-width:0;}
.card .nm b{display:block; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card .nm small{color:var(--dim); font-size:12px;}
.badge{
  font-size:12px; font-weight:800; border-radius:8px; padding:4px 8px;
  background:#1c1c22; border:1px solid var(--line); color:var(--amber);
}
.card.sel{border-color:var(--red);}
.mini{
  background:#1c1c22; color:var(--txt); border:1px solid var(--line);
  border-radius:10px; font-size:13px; font-weight:700; padding:9px 11px;
}
.mini.danger{color:var(--red); border-color:#4a2226;}
.mini.go{color:var(--green); border-color:#1d4030;}
.addrow{display:flex; gap:8px; margin-top:6px;}
.addrow input{
  flex:1; background:#1c1c22; border:1px solid var(--line); color:var(--txt);
  border-radius:12px; font-size:16px; padding:12px; font-family:inherit;
}
.addrow select{
  background:#1c1c22; border:1px solid var(--line); color:var(--txt);
  border-radius:12px; font-size:16px; padding:0 10px; font-family:inherit;
}
#addProfileBtn{background:var(--green); color:#fff; border:0; border-radius:12px; font-size:15px; font-weight:800; padding:0 18px;}
.empty{color:var(--dim); text-align:center; padding:32px 20px; font-size:14px; line-height:1.6;}
#playerModal{position:fixed; inset:0; background:rgba(0,0,0,.94); z-index:50; display:flex; flex-direction:column;}
#playerModal[hidden]{display:none;}
#player{flex:1; width:100%; background:#000; min-height:0;}
.prow{display:flex; gap:8px; padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px);}
.prow .mini{flex:1; font-size:15px; padding:13px 0;}
#toast{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 90px); transform:translateX(-50%) translateY(20px);
  background:#232329; color:var(--txt); border:1px solid var(--line); border-radius:999px;
  padding:11px 20px; font-size:14px; font-weight:600; opacity:0; pointer-events:none;
  transition:opacity .25s, transform .25s; z-index:99; max-width:88%; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header class="topbar">
  <h1>SWING<span>DELAY</span></h1>
  <button id="profileChip" type="button">No hitter ▾</button>
</header>

<main id="viewCamera">
  <div id="stage">
    <canvas id="view"></canvas>
    <video id="delayPlayer" muted playsinline preload="auto" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000"></video>
    <div id="recDot" hidden><i></i>REC</div>
    <div id="warmup" class="overlay" hidden><div class="warmup-inner"><span class="dot"></span>BUFFERING…</div></div>
    <div id="startOverlay" class="overlay">
      <button id="startBtn" type="button">Start Camera</button>
      <p>Point the phone at the cage. The screen replays each swing on a delay so hitters can watch right after they hit.</p>
      <p style="font-size:12px">Use this in Safari — the iPhone camera doesn't work from a full-screen home-screen icon.</p>
      <div id="camError" hidden style="background:#2a1215;border:1px solid #5c2228;border-radius:14px;padding:14px;max-width:330px">
        <b style="color:#ff8589">Camera unavailable</b>

    <div class="crow" style="gap:6px">
      <button type="button" class="tbtn preset" data-d="8" style="flex:1">8s</button>

    </div>
    <div class="crow">
      <div class="seg" style="flex:1">
        <button id="modeDelay" type="button" class="on">Delay</button>
        <button id="modeLive" type="button">Live</button>

    </div>

      <button id="saveLenBtn" type="button" class="tbtn">⏱ 10s</button>
      <button id="saveBtn" type="button">● SAVE SWING</button>

</main>

<section id="viewProfiles" class="page" hidden>
  <div class="pagehead"><h2>Hitters</h2><button id="backFromProfiles" type="button" class="mini">← Camera</button></div>
  <div class="scroll">
    <div id="profileList"></div>

</section>

    <button id="shareSwingBtn" type="button" class="mini go">Share</button>

  </div>

<div id="toast"></div>
<video id="src" muted playsinline style="display:none"></video>

<script>
'use strict';
/* ================= helpers ================= */
const $ = (id) => document.getElementById(id);
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' +
         d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}
function fileStamp(ts){
  const d = new Date(ts), p = (n) => String(n).padStart(2,'0');
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}
function fmtDelay(s){
  s = Math.round(s);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60), r = s % 60;
  return r ? (m + 'm ' + r + 's') : (m + 'm');
}
function safeName(s){ return ((s || 'hitter').replace(/[^\w\-]+/g,'').slice(0,24)) || 'hitter'; }

/* ================= prefs ================= */
const DEFAULT_PREFS = { delay:8, mode:'delay', saveLen:10, facing:'user', flip:{user:false,environment:false}, profileId:null, autoClip:true, sens:'med' };
let prefs = Object.assign({}, DEFAULT_PREFS);
try {
  const raw = localStorage.getItem('swingdelay-prefs');
  if (raw) prefs = Object.assign({}, DEFAULT_PREFS, JSON.parse(raw));
} catch(e){}
if (!prefs.flip || typeof prefs.flip !== 'object') prefs.flip = {user:false, environment:false};
function savePrefs(){ try { localStorage.setItem('swingdelay-prefs', JSON.stringify(prefs)); } catch(e){} }
function flipOn(){ return !!(prefs.flip && prefs.flip[prefs.facing]); }

/* ================= IndexedDB ================= */
let db = null;
function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('swing-delay-db', 1);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      d.createObjectStore('profiles', {keyPath:'id', autoIncrement:true});
      const s = d.createObjectStore('swings', {keyPath:'id', autoIncrement:true});
      s.createIndex('byProfile', 'profileId', {unique:false});
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = () => reject(req.error);
  });
}
function idb(store, mode, fn){
  return new Promise((resolve, reject) => {
    let req;
    try { req = fn(db.transaction(store, mode).objectStore(store)); }
    catch(err){ reject(err); return; }
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
const Profiles = {
  all: () => idb('profiles','readonly',(s) => s.getAll()),
  add: (p) => idb('profiles','readwrite',(s) => s.add(p)),
  del: (id) => idb('profiles','readwrite',(s) => s.delete(id))
};
const Swings = {
  byProfile: (pid) => idb('swings','readonly',(s) => s.index('byProfile').getAll(pid)),
  get: (id) => idb('swings','readonly',(s) => s.get(id)),
  add: (sw) => idb('swings','readwrite',(s) => s.add(sw)),
  del: (id) => idb('swings','readwrite',(s) => s.delete(id))
};

/* ================= camera + delay engine ================= */
const src = $('src'), view = $('view'), vctx = view.getContext('2d'), dpv = $('delayPlayer');
const capCanvas = document.createElement('canvas');   // small frames for the delay buffer
const recCanvas = document.createElement('canvas');   // full-res frames for recording
let stream = null, camReady = false, capTimer = null, rafId = 0;
let frameBuf = [];              // [{bm: ImageBitmap, t}] newest last (t = performance.now())
let lastDrawn = null;           // bitmap currently on the display canvas (skip redundant redraws)
let recorder = null, chunks = [], initChunk = null, recMime = '', recExt = 'mp4';
const MAX_BUF_MS = 17500;       // covers the 15s max delay + margin
let recTick = 0;

function drawCorrected(ctx, w, h, flip){
  const vw = src.videoWidth, vh = src.videoHeight;
  if (!vw || !vh || src.readyState < 2) return false;
  const s = Math.max(w/vw, h/vh), dw = vw*s, dh = vh*s;
  const dx = (w-dw)/2, dy = (h-dh)/2;
  ctx.save();
  if (flip){ ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(src, dx, dy, dw, dh);
  ctx.restore();
  return true;
}
function drawCover(ctx, img, cw, ch){
  const vw = img.width || img.videoWidth || img.naturalWidth, vh = img.height || img.videoHeight || img.naturalHeight;
  if (!vw || !vh) return;
  const s = Math.max(cw/vw, ch/vh), dw = vw*s, dh = vh*s;
  ctx.drawImage(img, (cw-dw)/2, (ch-dh)/2, dw, dh);
}
/* ================= swing auto-detection =================
   Watches the motion level of the captured frames. A swing shows up as a
   burst of strong motion; when it settles, the clip [start-1.2s, end+0.6s]
   is saved automatically under the selected hitter. */
const MOTION_W = 48, MOTION_H = 27;
const motionCanvas = document.createElement('canvas');
motionCanvas.width = MOTION_W; motionCanvas.height = MOTION_H;
const motionCtx = motionCanvas.getContext('2d', {willReadFrequently:true});
let prevMotion = null, consecHigh = 0, consecLow = 0;
let swingState = 'idle', swingStartWall = 0, lastClipAt = 0;
const SENS = {
  low:  {start:0.16, end:0.050, label:'Low'},
  med:  {start:0.10, end:0.040, label:'Med'},
  high: {start:0.06, end:0.030, label:'High'}
};
function resetSwingDetect(){ swingState = 'idle'; consecHigh = 0; consecLow = 0; prevMotion = null; }
function motionScore(){
  motionCtx.drawImage(capCanvas, 0, 0, MOTION_W, MOTION_H);
  let d;
  try { d = motionCtx.getImageData(0, 0, MOTION_W, MOTION_H).data; }
  catch(e){ return 0; }
  if (!prevMotion){ prevMotion = new Uint8ClampedArray(d.length); prevMotion.set(d); return 0; }
  let sum = 0;
  const n = MOTION_W * MOTION_H;
  for (let i = 0; i < d.length; i += 4){
    const g = (d[i] + d[i+1] + d[i+2]) / 3;
    const pg = (prevMotion[i] + prevMotion[i+1] + prevMotion[i+2]) / 3;
    sum += Math.abs(g - pg);
  }
  prevMotion.set(d);
  return sum / n / 255;
}
function updateSwingDetect(score){
  const now = Date.now();
  if (!prefs.autoClip || !prefs.profileId || !camReady){ resetSwingDetect(); return; }
  if (now - lastClipAt < 5000){ resetSwingDetect(); return; }   // cooldown between auto clips
  const th = SENS[prefs.sens] || SENS.med;
  if (swingState === 'idle'){
    consecHigh = (score > th.start) ? consecHigh + 1 : 0;
    if (consecHigh >= 3){ swingState = 'swinging'; swingStartWall = now; consecLow = 0; }
  } else {
    consecLow = (score < th.end) ? consecLow + 1 : 0;
    const dur = now - swingStartWall;
    if ((consecLow >= 8 && dur > 800) || dur > 6000) finishAutoClip(now);
  }
}
function finishAutoClip(now){
  resetSwingDetect();
  lastClipAt = now;
  let t0 = swingStartWall - 1200, t1 = now + 600;
  if (t1 - t0 < 2000) t1 = t0 + 2000;
  const blob = extractClip(t0, t1);
  if (!blob) return;   // not enough buffered video yet
  const dur = Math.round((t1 - t0) / 1000);
  Swings.add({profileId: prefs.profileId, ts: Date.now(), dur: dur, mime: recMime, blob: blob}).then(() => {
    toast('Auto-clipped swing ✓');
    if (!$('viewSwings').hidden) renderSwings();
  }).catch(() => {});
}

/* ============ delay frame buffer (ImageBitmap ring, no encode/decode) ============ */
function captureFrame(){
  if (!camReady || src.readyState < 2) return;
  const vw = src.videoWidth, vh = src.videoHeight;
  if (!vw || !vh) return;
  const W = 320, H = Math.round(W * vh / vw);
  if (capCanvas.width !== W || capCanvas.height !== H){ capCanvas.width = W; capCanvas.height = H; }
  if (!drawCorrected(capCanvas.getContext('2d'), W, H, flipOn())) return;
  const t = performance.now();
  if (window.createImageBitmap){
    createImageBitmap(capCanvas).then((bm) => {
      frameBuf.push({bm: bm, t: t});
      pruneFrames();
    }).catch(() => {});
  }
  updateSwingDetect(motionScore());
}
function pruneFrames(){
  const cutoff = performance.now() - MAX_BUF_MS;
  while (frameBuf.length && frameBuf[0].t < cutoff){
    const f = frameBuf.shift();
    try { f.bm.close(); } catch(e){}
  }
}
function clearFrames(){
  frameBuf.forEach((f) => { try { f.bm.close(); } catch(e){} });
  frameBuf = [];
  lastDrawn = null;
}

/* ============ long-delay playback (for delays over 15s, up to 2 min) ============
   The recorder's 1-second chunks double as a ~2.5-minute lookback buffer, so
   long delays play those chunks through a video element instead of the
   frame ring (which would need far too much memory at that range). */
let dpCurT = -1, dpUrl = null, dpLastTick = 0;
function dpCleanup(){
  try { dpv.pause(); } catch(e){}
  dpv.removeAttribute('src'); dpv.load();
  if (dpUrl){ try { URL.revokeObjectURL(dpUrl); } catch(e){} dpUrl = null; }
  dpCurT = -1;
  dpv.style.display = 'none';
}
function dpChunkFor(target){
  for (let i = chunks.length - 1; i >= 0; i--){
    const c = chunks[i];
    if (c.blob === initChunk) continue;
    if (c.t - 1000 <= target) return c;
  }
  return null;
}
function dpPlayChunkT(t){
  const c = chunks.find((x) => x.t === t && x.blob !== initChunk);
  if (!c || !initChunk) return;
  if (dpUrl){ try { URL.revokeObjectURL(dpUrl); } catch(e){} }
  dpCurT = t;
  dpUrl = URL.createObjectURL(new Blob([initChunk, c.blob], {type: recMime}));
  dpv.style.display = 'block';
  if (dpv.src !== dpUrl) dpv.src = dpUrl;
  dpv.play().catch(() => {});
}
function dpTick(){
  if (!camReady || !initChunk || chunks.length < 3) return;
  const target = Date.now() - prefs.delay * 1000;
  const c = dpChunkFor(target);
  if (!c){ $('warmup').hidden = false; return; }   // still buffering up to the delay
  $('warmup').hidden = true;
  if (c.t === dpCurT){
    if (dpv.paused) dpv.play().catch(() => {});
    return;
  }
  dpPlayChunkT(c.t);
}
function dpOnEnded(){
  // advance to the chunk right after the one that just finished
  const want = dpCurT + 1000;
  let best = null, bestD = 1e9;
  for (const c of chunks){
    if (c.blob === initChunk) continue;
    const d = Math.abs(c.t - want);
    if (d < bestD){ bestD = d; best = c; }
  }
  if (best && bestD < 800) dpPlayChunkT(best.t);
  else dpCurT = -1;   // watchdog tick will resync
}
function drawLoop(){
  rafId = requestAnimationFrame(drawLoop);
  if (!camReady || src.readyState < 2) return;
  const cw = view.width, ch = view.height;
  if (!cw || !ch) return;
  const flip = flipOn();
  const longDelay = prefs.mode === 'delay' && prefs.delay > 15;
  if (longDelay){
    if (dpv.style.display !== 'block') dpv.style.display = 'block';
    const nowMs = performance.now();
    if (nowMs - dpLastTick > 400){ dpLastTick = nowMs; dpTick(); }
  } else {
    if (dpv.style.display === 'block') dpCleanup();
    if (prefs.mode === 'live'){
      // live preview goes through the corrected path too, so the mirror toggle is honored
      vctx.fillStyle = '#000';
      vctx.fillRect(0, 0, cw, ch);
      if (!drawCorrected(vctx, cw, ch, flip)) drawCover(vctx, src, cw, ch);
      lastDrawn = null;
      $('warmup').hidden = true;
    } else {
      const target = performance.now() - prefs.delay*1000;
      let f = null;
      for (let i = frameBuf.length-1; i >= 0; i--){ if (frameBuf[i].t <= target){ f = frameBuf[i]; break; } }
      if (!f && frameBuf.length) f = frameBuf[0];
      if (f){
        // Redraw ONLY when the frame actually changes — and clear+draw together,
        // otherwise the screen strobes black between frames.
        if (f.bm !== lastDrawn){
          vctx.fillStyle = '#000';
          vctx.fillRect(0, 0, cw, ch);
          drawCover(vctx, f.bm, cw, ch);
          lastDrawn = f.bm;
        }
        const span = performance.now() - frameBuf[0].t;
        $('warmup').hidden = span >= prefs.delay*1000;
      } else {
        $('warmup').hidden = false;
      }
    }
  }
  // background recording canvas (corrected, full res) — every 2nd frame is plenty
  if ((recTick++ % 2) === 0){
    const vw = src.videoWidth, vh = src.videoHeight;
    if (vw && vh){
      const RW = 1280, RH = Math.round(RW * vh / vw);
      if (recCanvas.width !== RW || recCanvas.height !== RH){ recCanvas.width = RW; recCanvas.height = RH; }
      drawCorrected(recCanvas.getContext('2d'), RW, RH, flip);
    }
  }
}
function pickMime(){
  if (!window.MediaRecorder) return '';
  const cands = ['video/mp4;codecs="avc1.42E01E,mp4a.40.2"','video/mp4','video/webm;codecs=vp9','video/webm'];
  for (const m of cands){ try { if (MediaRecorder.isTypeSupported(m)) return m; } catch(e){} }
  return '';
}
function startRecorder(){
  stopRecorder();
  recMime = pickMime();
  if (!recMime){ toast('This browser cannot record video.'); return; }
  recExt = recMime.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
  chunks = []; initChunk = null;
  let rs = null;
  try { rs = recCanvas.captureStream(24); } catch(e){ toast('Recording is not supported here.'); return; }
  try {
    recorder = new MediaRecorder(rs, {mimeType: recMime, videoBitsPerSecond: 4000000});
  } catch(e){ toast('Recorder failed to start.'); return; }
  recorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0){
      if (!initChunk) initChunk = e.data;
      chunks.push({blob:e.data, t:Date.now()});
      const cut = Date.now() - 150000;
      while (chunks.length && chunks[0].t < cut) chunks.shift();
    }
  };
  recorder.onerror = () => toast('Recording error.');
  try { recorder.start(1000); } catch(e){}
}
function stopRecorder(){
  if (recorder && recorder.state !== 'inactive'){ try { recorder.stop(); } catch(e){} }
  recorder = null;
}
let starting = false;
function showCamError(kind){
  const box = $('camError'), txt = $('camErrorText');
  let msg;
  if (kind === 'standalone'){
    msg = 'You opened the old full-screen icon, and Apple blocks the iPhone camera in those. Delete this icon from your home screen, then open the app link in Safari (or add it to your home screen again — the new icon opens in Safari, where the camera works).';
  } else if (kind === 'noapi'){
    msg = 'This browser can\u2019t reach the camera. Open the app link in Safari on your iPhone and tap Start Camera there.';
  } else if (kind === 'NotAllowedError' || kind === 'SecurityError'){
    msg = 'Camera permission was blocked. In Safari, tap the aA button in the address bar \u2192 Website Settings \u2192 Camera \u2192 Allow, then tap Start Camera again.';
  } else if (kind === 'NotFoundError' || kind === 'OverconstrainedError'){
    msg = 'No camera was found on this device (' + kind + ').';
  } else {
    msg = 'The camera didn\u2019t start (' + (kind || 'unknown error') + '). Try opening the app link in Safari.';
  }
  txt.textContent = msg;
  box.hidden = false;
}
function hideCamError(){ $('camError').hidden = true; }
async function startCamera(){
  if (starting) return;
  hideCamError();
  if (window.navigator.standalone === true){ showCamError('standalone'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ showCamError('noapi'); return; }
  starting = true;
  const btn = $('startBtn');
  btn.disabled = true; btn.textContent = 'Starting…';
  stopCamera();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: prefs.facing, width:{ideal:1280}, height:{ideal:720}},
      audio: false
    });
  } catch(err){
    starting = false;
    btn.disabled = false; btn.textContent = 'Start Camera';
    showCamError(err && err.name);
    return;
  }
  src.srcObject = stream;
  try { await src.play(); } catch(e){}
  camReady = true;
  $('startOverlay').hidden = true;
  $('recDot').hidden = false;
  clearFrames();
  resetSwingDetect();
  fitCanvas();
  capTimer = setInterval(captureFrame, 83);
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(drawLoop);
  startRecorder();
  starting = false;
  btn.disabled = false; btn.textContent = 'Start Camera';
}
function stopCamera(){
  camReady = false;
  if (capTimer){ clearInterval(capTimer); capTimer = null; }
  cancelAnimationFrame(rafId);
  stopRecorder();
  if (stream){ stream.getTracks().forEach((t) => { try { t.stop(); } catch(e){} }); stream = null; }
  src.srcObject = null;
  clearFrames();
  resetSwingDetect();
  dpCleanup();
  $('startOverlay').hidden = false;
  $('warmup').hidden = true;
  $('recDot').hidden = true;
}

/* ================= clip extraction + saving =================
   The recorder keeps ~2.5 min of 1s chunks. A clip is the init segment +
   every chunk overlapping [t0, t1]. */
function extractClip(t0, t1){
  if (!recorder || !initChunk || chunks.length < 3) return null;
  const segs = chunks.filter((c) => {
    if (c.blob === initChunk) return false;
    const cs = c.t - 1000, ce = c.t;   // chunk covers roughly [t-1000, t]
    return cs <= t1 && ce >= t0;
  }).map((c) => c.blob);
  if (!segs.length) return null;
  return new Blob([initChunk].concat(segs), {type: recMime});
}
async function saveSwing(){
  if (!prefs.profileId){ toast('Pick a hitter first.'); showView('profiles'); return; }
  const now = Date.now();
  const blob = extractClip(now - prefs.saveLen*1000, now);
  if (!blob){ toast('Still rolling — try again in a few seconds.'); return; }
  try {
    await Swings.add({profileId: prefs.profileId, ts: Date.now(), dur: prefs.saveLen, mime: recMime, blob: blob});
  } catch(e){ toast('Save failed — storage may be full.'); return; }
  const p = await getProfile(prefs.profileId);
  toast('Saved to ' + (p ? p.name : 'hitter'));
  if (!$('viewSwings').hidden) renderSwings();
}
async function getProfile(id){
  const all = await Profiles.all();
  for (const p of all) if (p.id === id) return p;
  return null;
}

/* ================= views ================= */
const VIEWS = ['viewCamera','viewProfiles','viewSwings'];
function showView(id){
  VIEWS.forEach((v) => { $(v).hidden = (v !== id); });
  if (id === 'viewProfiles') renderProfiles();
  if (id === 'viewSwings') renderSwings();
  if (id === 'viewCamera') fitCanvas();
}
function fitCanvas(){
  const r = $('stage').getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (view.width !== w || view.height !== h){ view.width = w; view.height = h; }
}

/* ================= profiles UI ================= */
async function refreshChip(){
  const p = prefs.profileId ? await getProfile(prefs.profileId) : null;
  $('profileChip').innerHTML = p ? (escapeHtml(p.name) + '<span class="bats">' + escapeHtml(p.bats||'') + '</span> ▾') : 'No hitter ▾';
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function renderProfiles(){
  const list = $('profileList');
  const profiles = await Profiles.all();
  profiles.sort((a,b) => (a.name||'').localeCompare(b.name||''));
  if (!profiles.length){ list.innerHTML = '<div class="empty">No hitters yet.<br/>Add your first hitter below.</div>'; return; }
  const counts = {};
  for (const p of profiles){
    try { counts[p.id] = (await Swings.byProfile(p.id)).length; } catch(e){ counts[p.id] = 0; }
  }
  list.innerHTML = '';
  profiles.forEach((p) => {
    const card = document.createElement('div');
    card.className = 'card' + (p.id === prefs.profileId ? ' sel' : '');
    const nm = document.createElement('div'); nm.className = 'nm';
    const b = document.createElement('b'); b.textContent = p.name;
    const sm = document.createElement('small'); sm.textContent = (counts[p.id]||0) + ' saved swings';
    nm.appendChild(b); nm.appendChild(sm);
    const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = p.bats || '';
    const sel = document.createElement('button'); sel.type='button'; sel.className='mini go'; sel.textContent='Select';
    sel.onclick = async () => { prefs.profileId = p.id; savePrefs(); await refreshChip(); await renderProfiles(); toast(p.name + ' selected'); };
    const vw = document.createElement('button'); vw.type='button'; vw.className='mini'; vw.textContent='Swings';
    vw.onclick = async () => { prefs.profileId = p.id; savePrefs(); await refreshChip(); showView('swings'); };
    const del = document.createElement('button'); del.type='button'; del.className='mini danger'; del.textContent='✕';
    del.onclick = async () => {
      if (!confirm('Delete ' + p.name + ' and all saved swings?')) return;
      const sws = await Swings.byProfile(p.id);
      for (const s of sws){ try { await Swings.del(s.id); } catch(e){} }
      await Profiles.del(p.id);
      if (prefs.profileId === p.id){ prefs.profileId = null; savePrefs(); await refreshChip(); }
      await renderProfiles();
    };
    card.appendChild(nm); card.appendChild(badge); card.appendChild(sel); card.appendChild(vw); card.appendChild(del);
    list.appendChild(card);
  });
}
async function renderSwings(){
  const list = $('swingList');
  const p = prefs.profileId ? await getProfile(prefs.profileId) : null;
  $('swingsTitle').textContent = p ? ('Swings — ' + p.name) : 'Swings';
  if (!p){ list.innerHTML = '<div class="empty">Pick a hitter first.</div>'; return; }
  let sws = [];
  try { sws = await Swings.byProfile(p.id); } catch(e){}
  sws.sort((a,b) => b.ts - a.ts);
  if (!sws.length){ list.innerHTML = '<div class="empty">No saved swings for ' + escapeHtml(p.name) + ' yet.<br/>Hit ● SAVE SWING on the camera screen after a swing.</div>'; return; }
  list.innerHTML = '';
  sws.forEach((s) => {
    const card = document.createElement('div'); card.className = 'card';
    const nm = document.createElement('div'); nm.className = 'nm';
    const b = document.createElement('b'); b.textContent = fmtDate(s.ts);
    const sm = document.createElement('small'); sm.textContent = 'last ' + (s.dur || '?') + 's • ' + ((s.mime||'').indexOf('mp4') >= 0 ? 'mp4' : 'webm');
    nm.appendChild(b); nm.appendChild(sm);
    const play = document.createElement('button'); play.type='button'; play.className='mini go'; play.textContent='Play';
    play.onclick = () => openPlayer(s.id);
    const dl = document.createElement('button'); dl.type='button'; dl.className='mini'; dl.textContent='⤓';
    dl.onclick = () => downloadSwing(s.id);
    const del = document.createElement('button'); del.type='button'; del.className='mini danger'; del.textContent='✕';
    del.onclick = async () => { if (!confirm('Delete this swing?')) return; await Swings.del(s.id); await renderSwings(); };
    card.appendChild(nm); card.appendChild(play); card.appendChild(dl); card.appendChild(del);
    list.appendChild(card);
  });
}

/* ================= player modal ================= */
let playerSwingId = null, playerUrl = null;
async function openPlayer(id){
  const s = await Swings.get(id);
  if (!s){ toast('Swing not found.'); return; }
  playerSwingId = id;
  if (playerUrl){ try { URL.revokeObjectURL(playerUrl); } catch(e){} }
  playerUrl = URL.createObjectURL(s.blob);
  const v = $('player');
  v.src = playerUrl;
  $('playerModal').hidden = false;
  try { await v.play(); } catch(e){}
}
function closePlayer(){
  const v = $('player');
  try { v.pause(); } catch(e){}
  v.removeAttribute('src'); v.load();
  if (playerUrl){ try { URL.revokeObjectURL(playerUrl); } catch(e){} playerUrl = null; }
  playerSwingId = null;
  $('playerModal').hidden = true;
}
async function swingFile(id){
  const s = await Swings.get(id);
  if (!s) return null;
  const p = await getProfile(s.profileId);
  const ext = (s.mime && s.mime.indexOf('mp4') >= 0) ? 'mp4' : 'webm';
  const fname = 'Swing-' + safeName(p ? p.name : 'hitter') + '-' + fileStamp(s.ts) + '.' + ext;
  return {blob: s.blob, mime: s.mime || 'video/mp4', fname: fname};
}
async function downloadSwing(id){
  const f = await swingFile(id);
  if (!f){ toast('Swing not found.'); return; }
  const url = URL.createObjectURL(f.blob);
  const a = document.createElement('a');
  a.href = url; a.download = f.fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => { try { URL.revokeObjectURL(url); } catch(e){} }, 8000);
  toast('Downloading…');
}
async function shareSwing(id){
  const f = await swingFile(id);
  if (!f){ toast('Swing not found.'); return; }
  try {
    const file = new File([f.blob], f.fname, {type: f.mime});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Swing video'});
      return;
    }
  } catch(e){ /* user cancelled or share failed */ return; }
  toast('Sharing is not supported here — use Download.');
}

/* ================= wiring ================= */
function syncControls(){
  $('delayRange').value = Math.min(120, Math.max(2, prefs.delay));
  $('delayVal').textContent = fmtDelay(prefs.delay);
  $('modeDelay').classList.toggle('on', prefs.mode === 'delay');
  $('modeLive').classList.toggle('on', prefs.mode === 'live');
  $('camSwitch').textContent = prefs.facing === 'user' ? '🤳 Front' : '📷 Back';
  $('mirrorBtn').textContent = '🪞 Mirror: ' + (flipOn() ? 'On' : 'Off');
  $('mirrorBtn').classList.toggle('on', flipOn());
  $('saveLenBtn').textContent = '⏱ ' + prefs.saveLen + 's';
  $('saveBtn').textContent = '● SAVE LAST ' + prefs.saveLen + 's';
  $('autoClipBtn').textContent = '✂️ Auto-clip: ' + (prefs.autoClip ? 'On' : 'Off');
  $('autoClipBtn').classList.toggle('on', !!prefs.autoClip);
  $('sensBtn').textContent = 'Sensitivity: ' + ((SENS[prefs.sens] || SENS.med).label);
}
async function init(){
  try { db = await openDB(); }
  catch(e){ toast('Storage unavailable — profiles and swings will not save.'); }
  syncControls();
  await refreshChip();
  $('delayRange').addEventListener('input', (e) => { prefs.delay = parseInt(e.target.value,10) || 8; savePrefs(); syncControls(); });
  document.querySelectorAll('.preset').forEach((b) => {
    b.onclick = () => { prefs.delay = parseInt(b.dataset.d, 10) || 8; savePrefs(); syncControls(); };
  });
  dpv.addEventListener('ended', dpOnEnded);
  dpv.addEventListener('error', () => { dpCurT = -1; });
  $('modeDelay').onclick = () => { prefs.mode = 'delay'; savePrefs(); syncControls(); };
  $('modeLive').onclick = () => { prefs.mode = 'live'; savePrefs(); syncControls(); };
  $('camSwitch').onclick = async () => {
    prefs.facing = prefs.facing === 'user' ? 'environment' : 'user';
    savePrefs(); syncControls();
    if (camReady) await startCamera();
    toast(prefs.facing === 'user' ? 'Front camera' : 'Back camera');
  };
  $('mirrorBtn').onclick = () => {
    prefs.flip[prefs.facing] = !flipOn();
    savePrefs(); syncControls();
    toast(flipOn() ? 'Mirror on — image flipped' : 'Mirror off — true orientation');
  };
  const lens = [5,10,15];
  $('saveLenBtn').onclick = () => {
    const i = lens.indexOf(prefs.saveLen);
    prefs.saveLen = lens[(i+1) % lens.length];
    savePrefs(); syncControls();
  };
  $('startBtn').onclick = startCamera;
  $('copyLinkBtn').onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); toast('Link copied — paste it in Safari'); }
    catch(e){ toast('Copy failed — long-press the address bar to copy the link'); }
  };
  $('saveBtn').onclick = saveSwing;
  $('autoClipBtn').onclick = () => {
    prefs.autoClip = !prefs.autoClip; savePrefs(); syncControls(); resetSwingDetect();
    toast(prefs.autoClip ? 'Auto-clip on — swings save themselves' : 'Auto-clip off');
  };
  $('sensBtn').onclick = () => {
    const order = ['low','med','high'];
    prefs.sens = order[(order.indexOf(prefs.sens) + 1) % order.length];
    savePrefs(); syncControls(); resetSwingDetect();
  };
  $('profileChip').onclick = () => showView('profiles');
  $('navHitters').onclick = () => showView('profiles');
  $('navSwings').onclick = () => showView('swings');
  $('backFromProfiles').onclick = () => showView('camera');
  $('backFromSwings').onclick = () => showView('camera');
  $('addProfileBtn').onclick = async () => {
    const name = $('newName').value.trim();
    if (!name){ toast('Type a hitter name first.'); return; }
    const bats = $('newBats').value;
    const id = await Profiles.add({name:name, bats:bats, ts:Date.now()});
    $('newName').value = '';
    prefs.profileId = id; savePrefs();
    await refreshChip(); await renderProfiles();
    toast(name + ' added');
  };
  $('newName').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('addProfileBtn').click(); });
  $('closePlayerBtn').onclick = closePlayer;
  $('dlSwingBtn').onclick = () => { if (playerSwingId) downloadSwing(playerSwingId); };
  $('shareSwingBtn').onclick = () => { if (playerSwingId) shareSwing(playerSwingId); };
  $('delSwingBtn').onclick = async () => {
    if (!playerSwingId) return;
    if (!confirm('Delete this swing?')) return;
    await Swings.del(playerSwingId);
    closePlayer(); await renderSwings();
  };
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 300));
  document.addEventListener('pagehide', stopCamera);
  fitCanvas();
  if (window.navigator.standalone === true) showCamError('standalone');
  showView('camera');
}
document.addEventListener('DOMContentLoaded', init);
</script>
